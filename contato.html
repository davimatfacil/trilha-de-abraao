<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fale com o Davi</title>
<meta name="description" content="Envie uma mensagem para o Davi: sugestões de perguntas para a Trilha de Abraão, parcerias e contato profissional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Mesma identidade do jogo: céu noturno de Gênesis 15:5 */
:root{
  --night:#121830; --night-2:#1b2345; --night-3:#26305a;
  --ink:#ece6d3; --muted:#9aa0c2; --sand:#cdb98c; --star:#f2c14e;
  --ok:#6fcf97; --bad:#ef7d6b;
  --display:"Alegreya SC", Georgia, "Times New Roman", serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--ink)}
body{
  font-family:var(--body);font-size:16px;line-height:1.5;
  background:
    radial-gradient(1px 1px at 12% 8%, var(--ink) 50%, transparent 51%),
    radial-gradient(1px 1px at 38% 22%, var(--muted) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 72% 12%, var(--star) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 34%, var(--ink) 50%, transparent 51%),
    radial-gradient(1px 1px at 55% 5%, var(--muted) 50%, transparent 51%),
    radial-gradient(ellipse at 50% -20%, var(--night-3), var(--night) 60%);
  background-attachment:fixed;
  padding:24px 16px 40px;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
nav{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.95rem}
a{color:var(--star)}
a:hover{color:var(--ink)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--star);outline-offset:2px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;margin:0;text-wrap:balance}
h1 span{color:var(--star)}
.lead{margin:.5rem 0 0;color:var(--muted)}
form{background:color-mix(in srgb,var(--night-2) 88%,transparent);border:1px solid var(--night-3);border-top:6px solid var(--star);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--sand)}
input,textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--night);border:1px solid var(--night-3);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:140px;resize:vertical}
::placeholder{color:var(--muted);opacity:.8}
button{font-family:var(--body);font-size:1.05rem;font-weight:700;cursor:pointer;border-radius:8px;border:1px solid var(--star);background:var(--star);color:var(--night);padding:12px 16px}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:wait}
.status{min-height:1.5em;margin:0;font-weight:700}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)} .status.info{color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav aria-label="Navegação">
    <a href="index.html">← Voltar ao jogo</a>
    <a href="https://davimatfacil.github.io/meu-site/">Meu site</a>
  </nav>

  <header>
    <h1>Fale com o <span>Davi</span></h1>
    <p class="lead">Sugestão de pergunta para a Trilha de Abraão, ideia de parceria ou só um oi. Eu respondo por e-mail.</p>
  </header>

  <!-- action: se o JavaScript falhar, o navegador envia o formulário do jeito tradicional -->
  <form id="contactForm" action="https://api.web3forms.com/submit" method="POST">
    <input type="hidden" name="access_key" value="4624b581-a2c0-441b-9666-bf9217295bcd">
    <input type="hidden" name="subject" value="Contato pela Trilha de Abraão">
    <input type="hidden" name="from_name" value="Site Trilha de Abraão">

    <!-- Isca anti-robô (honeypot): pessoas não veem este campo; robôs o preenchem e o envio é descartado -->
    <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display:none">

    <label for="nome">Seu nome
      <input id="nome" type="text" name="name" required maxlength="80" autocomplete="name">
    </label>
    <label for="email">Seu e-mail
      <input id="email" type="email" name="email" required maxlength="120" autocomplete="email" placeholder="voce@exemplo.com">
    </label>
    <label for="mensagem">Mensagem
      <textarea id="mensagem" name="message" required maxlength="2000"></textarea>
    </label>

    <button id="enviar" type="submit">Enviar mensagem</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="note">Seu nome e e-mail são usados só para eu responder.</p>
  </form>
</div>

<script>
const form   = document.getElementById("contactForm");
const botao  = document.getElementById("enviar");
const status = document.getElementById("status");

function mostrar(tipo, texto){            // tipo: ok | bad | info
  status.className = "status " + tipo;
  status.textContent = texto;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();                      // impede o envio tradicional (que sairia da página)
  botao.disabled = true;                   // evita clique duplo
  mostrar("info", "Enviando…");
  try {
    const resp = await fetch(form.action, {
      method: "POST",
      headers: { Accept: "application/json" },
      body: new FormData(form)             // FormData lê todos os campos, inclusive os escondidos
    });
    const dados = await resp.json();
    if (resp.ok && dados.success) {
      form.reset();
      mostrar("ok", "Mensagem enviada! Obrigado, eu respondo em breve.");
    } else {
      throw new Error(dados.message || "Falha no envio");
    }
  } catch (err) {
    mostrar("bad", "Não consegui enviar agora. Confira os campos e tente de novo em instantes.");
  } finally {
    botao.disabled = false;
  }
});
</script>
</body>
</html>
